services:
  # Define the Node.js Express + Vite React Web Service
  - type: web
    name: gamelog-app
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render will securely generate a strong cryptographic key automatically
      - key: DATABASE_URL
        fromDatabase:
          name: gamelog-db
          property: connectionString

databases:
  # Define the managed PostgreSQL instance
  - name: gamelog-db
    plan: free
    databaseName: gamelog
    user: gamelog_user